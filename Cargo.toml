[workspace]
members = [".", "crates/ark", "crates/ark-glyphs", "crates/ark-text", "tools/fontbake"]
# The font baker is run by hand (docs/localization.md); it is not a default member.
default-members = [".", "crates/ark", "crates/ark-glyphs", "crates/ark-text"]
# Path dependencies under the workspace root join it automatically; the
# vendored miniquad must stay outside so lints never run on it.
exclude = ["vendor/miniquad"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/oddurs/arkonk"

[package]
name = "arkonk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
default-run = "arkonk"
description = "A compact, fixed-timestep Rust brick breaker"
license.workspace = true
repository.workspace = true

[features]
default = ["scripts"]
# Glyph atlases for Chinese, Japanese, Korean, Thai and Arabic, about
# 2.3 MB; without them those languages fall back to the next preference.
# See docs/localization.md.
scripts = ["ark-glyphs/scripts"]
# Opt-in so development, CI tests and the benchmark never need a Steam client;
# see docs/steam/README.md.
steam = ["dep:steamworks"]

[dependencies]
ark = { path = "crates/ark" }
ark-glyphs = { path = "crates/ark-glyphs" }
ark-text = { path = "crates/ark-text" }
gilrs = "0.11.2"
macroquad = { version = "0.4.16", features = ["audio"] }
steamworks = { version = "0.13.1", optional = true }
# The OS language list, through each platform's own API; no dependencies
# on desktop targets.
sys-locale = "0.3.2"

[dev-dependencies]
insta = "1.49.0"

# Embeds the icon and version resource. Host-gated: only Windows builds use it.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3

# Text layout and atlas inflation run thousands of times in the layout test.
# Neither holds simulation state, so the replay goldens (exact at opt-level
# 0) are untouched.
[profile.dev.package.ark-glyphs]
opt-level = 3
[profile.dev.package.ark-text]
opt-level = 3

# Localized macOS Metal fixes; provenance and patch scope in vendor/miniquad/ARKONK.md.
[patch.crates-io]
miniquad = { path = "vendor/miniquad" }
