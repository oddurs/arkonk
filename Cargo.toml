[package]
name = "arkonk"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
default-run = "arkonk"
description = "A compact, fixed-timestep Rust brick breaker"
license = "MIT"

[dependencies]
macroquad = { version = "0.4.16", features = ["audio"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3

# Localized macOS Metal fixes; provenance and patch scope in vendor/miniquad/ARKONK.md.
[patch.crates-io]
miniquad = { path = "vendor/miniquad" }
